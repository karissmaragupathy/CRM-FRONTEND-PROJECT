<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexaFlow — Deals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="shell"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        const session = requireAuth();
        const STAGES = ["prospecting", "proposal", "negotiation", "won", "lost"];

        function render() {
            const deals = getDeals();
            const accounts = getAccounts();
            const accountName = (id) => (accounts.find(a => a.id === id) || {}).name || "—";
            const options = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");

            const rows = deals.map(d => `
      <tr>
        <td>${d.name}</td>
        <td>${accountName(d.accountId)}</td>
        <td>${formatCurrency(d.value)}</td>
        <td><span class="badge ${d.stage}">${d.stage}</span></td>
        <td>${d.owner}</td>
        <td>
          <select onchange="updateStage('${d.id}', this.value)">
            ${STAGES.map(s => `<option value="${s}" ${s === d.stage ? "selected" : ""}>${s}</option>`).join("")}
          </select>
        </td>
      </tr>`).join("");

            document.getElementById("shell").innerHTML = `
      ${renderShellStart("deals.html", session)}
      <div class="page-head">
        <div><h1>Deals</h1><p>Opportunities in progress across all accounts.</p></div>
        <button class="btn accent" onclick="document.getElementById('modal').classList.remove('hidden')">Add Deal</button>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>Deal</th><th>Account</th><th>Value</th><th>Stage</th><th>Owner</th><th>Update stage</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6" class="empty">No deals yet.</td></tr>`}</tbody>
        </table>
      </div>
      ${SHELL_END}

      <div class="modal-backdrop hidden" id="modal">
        <div class="modal">
          <h3>Add Deal</h3>
          <form id="deal-form">
            <div class="field"><label>Deal name</label><input type="text" id="f-name" required /></div>
            <div class="field"><label>Account</label><select id="f-account" required><option value="">Select account</option>${options}</select></div>
            <div class="field"><label>Value ($)</label><input type="number" id="f-value" required min="0" /></div>
            <div style="display:flex;gap:.6rem;justify-content:flex-end">
              <button type="button" class="btn secondary" onclick="document.getElementById('modal').classList.add('hidden')">Cancel</button>
              <button type="submit" class="btn accent">Save</button>
            </div>
          </form>
        </div>
      </div>
    `;

            document.getElementById("deal-form").addEventListener("submit", function (e) {
                e.preventDefault();
                const deals = getDeals();
                deals.push({
                    id: uid("d"),
                    name: document.getElementById("f-name").value,
                    accountId: document.getElementById("f-account").value,
                    value: Number(document.getElementById("f-value").value),
                    stage: "prospecting",
                    owner: session.name,
                    closeDate: new Date().toISOString().slice(0, 10),
                });
                setDeals(deals);
                toast("Deal added.", "success");
                render();
            });
        }

        function updateStage(id, stage) {
            const deals = getDeals();
            const deal = deals.find(d => d.id === id);
            if (deal) deal.stage = stage;
            setDeals(deals);
            render();
        }

        render();
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexaFlow — Contacts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="shell"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
    <script>
        const session = requireAuth();

        function render() {
            const contacts = getContacts();
            const accounts = getAccounts();
            const accountName = (id) => (accounts.find(a => a.id === id) || {}).name || "—";

            const options = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");

            const rows = contacts.map(c => `
      <tr>
        <td>${c.name}</td>
        <td>${c.title}</td>
        <td>${accountName(c.accountId)}</td>
        <td>${c.email}</td>
        <td>${c.phone}</td>
      </tr>`).join("");

            document.getElementById("shell").innerHTML = `
      ${renderShellStart("contacts.html", session)}
      <div class="page-head">
        <div><h1>Contacts</h1><p>People at each account.</p></div>
        <button class="btn accent" onclick="document.getElementById('modal').classList.remove('hidden')">Add Contact</button>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>Name</th><th>Title</th><th>Account</th><th>Email</th><th>Phone</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="5" class="empty">No contacts yet.</td></tr>`}</tbody>
        </table>
      </div>
      ${SHELL_END}

      <div class="modal-backdrop hidden" id="modal">
        <div class="modal">
          <h3>Add Contact</h3>
          <form id="contact-form">
            <div class="field"><label>Name</label><input type="text" id="f-name" required /></div>
            <div class="field"><label>Title</label><input type="text" id="f-title" required /></div>
            <div class="field"><label>Account</label><select id="f-account" required><option value="">Select account</option>${options}</select></div>
            <div class="field"><label>Email</label><input type="email" id="f-email" required /></div>
            <div class="field"><label>Phone</label><input type="text" id="f-phone" required /></div>
            <div style="display:flex;gap:.6rem;justify-content:flex-end">
              <button type="button" class="btn secondary" onclick="document.getElementById('modal').classList.add('hidden')">Cancel</button>
              <button type="submit" class="btn accent">Save</button>
            </div>
          </form>
        </div>
      </div>
    `;

            document.getElementById("contact-form").addEventListener("submit", function (e) {
                e.preventDefault();
                const contacts = getContacts();
                contacts.push({
                    id: uid("ct"),
                    name: document.getElementById("f-name").value,
                    title: document.getElementById("f-title").value,
                    accountId: document.getElementById("f-account").value,
                    email: document.getElementById("f-email").value,
                    phone: document.getElementById("f-phone").value,
                });
                setContacts(contacts);
                toast("Contact added.", "success");
                render();
            });
        }

        render();
    </script>
</body>

</html>

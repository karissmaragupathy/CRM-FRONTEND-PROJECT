<script>
    // 1. Read the logged-in user's session
    const sessionData = sessionStorage.getItem('cp_user');

    if (!sessionData) {
        window.location.href = 'index.html';
    } else {
        const user = JSON.parse(sessionData);

        // 2. Display user information
        document.getElementById('userName').textContent =
            user.name || 'Alex Carter';

        document.getElementById('userRole').textContent =
            user.role || 'Executive';

        document.getElementById('userInitial').textContent =
            (user.name || 'A').charAt(0).toUpperCase();

        // 3. Identify the user's role
        const isAdmin =
            (user.role || '').toLowerCase().includes('admin');

        // 4. Apply a different dashboard design
        document.body.classList.add(
            isAdmin ? 'admin-view' : 'worker-view'
        );

        // 5. Change the dashboard heading
        const heading = document.querySelector('.header-left h2');

        if (heading) {
            heading.textContent = isAdmin
                ? 'ClientPilot | Admin Control Center'
                : 'ClientPilot | My Workspace';
        }

        // 6. Add a role-specific welcome banner
        const contentGrid = document.querySelector('.content-grid');

        if (contentGrid) {
            const banner = document.createElement('div');

            banner.className = 'role-banner';
            banner.textContent = isAdmin
                ? 'ADMIN VIEW — Monitor pipeline performance and manage operations.'
                : 'EMPLOYEE VIEW — Focus on your daily agenda and client follow-ups.';

            contentGrid.prepend(banner);
        }

        // 7. Add role-specific styles without editing another file
        const style = document.createElement('style');

        style.textContent = `
      .role-banner {
        grid-column: 1 / -1;
        padding: 16px 20px;
        margin-bottom: 4px;
        border-radius: 14px;
        font-size: 13px;
        font-weight: 600;
      }

      .admin-view .role-banner {
        background: #172554;
        color: white;
        border-left: 5px solid #60a5fa;
      }

      .admin-view .header-bar {
        border-bottom: 3px solid #2563eb;
      }

      .admin-view .overview-card {
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.12);
      }

      .worker-view .role-banner {
        background: #dcfce7;
        color: #166534;
        border-left: 5px solid #16a34a;
      }

      .worker-view .header-bar {
        border-bottom: 3px solid #16a34a;
      }

      /* Simplify the employee's view */
      .worker-view .overview-card,
      .worker-view .cards-row,
      .worker-view .right-col .side-panel:first-child {
        display: none;
      }

      .worker-view .content-grid {
        align-items: start;
      }

      .worker-view .alert-card {
        border-left: 4px solid #16a34a;
      }

      .admin-view .alert-card {
        border-left: 4px solid #2563eb;
      }
    `;

        document.head.appendChild(style);
    }

    // 8. Logout
    function logout() {
        sessionStorage.removeItem('cp_user');
        window.location.href = 'index.html';
    }
</script>

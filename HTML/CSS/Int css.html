<!DOCTYPE html>
<html>

<head>
    <title>Inline CSS - Subjects</title>
</head>

<body style="font-family: Arial, sans-serif; padding: 20px;">

    <!-- Moving banner using marquee -->
    <marquee style="background-color: darkblue; color: white; padding: 10px; font-weight: bold;" direction="right">
        My Registered Subjects
    </marquee>

    <h2>Subject List</h2>

    <!-- Each line styled separately -->
    <p style="color: red; font-size: 18px; font-weight: bold;">
        1. Front End Development and Frameworks
    </p>

    <p style="color: blue; background-color: lightyellow; padding: 5px;">
        2. Python Full Stack Development
    </p>

    <p style="color: green; border: 1px solid green; padding: 5px;">
        3. Data Structures & Algorithms
    </p>

    <p style="color: purple; text-decoration: underline;">
        4. Object Oriented Programming
    </p>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>Student Details Table</title>
    <style>
        table {
            width: 89%;
            border-collapse: collapse;
            /* Merges double borders into one */
            font-family: Arial, sans-serif;
        }

        th,
        td {
            border: 1px solid #000000;
            /* Solid black border */
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            /* Light gray background for header */
            font-weight: bold;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Name</th>
            <th>ID</th>
            <th>CGPA</th>
        </tr>
        <tr>
            <td>Rahul </td>
            <td>2300030101</td>
            <td>9.2</td>
        </tr>
        <tr>
            <td>Ananya </td>
            <td>2300030102</td>
            <td>8.8</td>
        </tr>
        <tr>
            <td>Priya </td>
            <td>2300030103</td>
            <td>9.5</td>
        </tr>
    </table>

</body>

</html>
